context:
  version: ${{ env.get("GIT_DESCRIBE_TAG", default="0.0.0") | replace("release-", "") }}
  build_number: ${{ env.get("GIT_DESCRIBE_NUMBER", default="0") }}
  build_hash: ${{ env.get("GIT_DESCRIBE_HASH", default="unknown") }}

package:
  name: libfdpio2
  version: ${{ version }}

source:
  path: ..

build:
  number: 0
  string: ${{ build_number }}_${{ build_hash }}
  script:
    - mkdir -p build
    - cd build
    - cmake -DCMAKE_INSTALL_PREFIX=$PREFIX ..
    - make
    - make install

requirements:
  build:
    - ${{ compiler('cxx') }}
    - ${{ stdlib('c') }}
    - cmake
    - make
    - pkg-config
  host:
    # Pin to XRootD 5.x: the xrdcl-pelican-fdp client plugin is a v5
    # (libXrdCl.so.3) plugin. Building against xrootd 6 (libXrdCl.so.6)
    # leaves FileSystem ops (Stat/DirList) unserviced by the v5 plugin —
    # they fail with "Operation not supported" even though file reads work.
    # TODO: drop this pin and move the whole stack to XRootD 6 once a v6
    # xrdcl-pelican-fdp plugin is available; the <6 pin is a stopgap to
    # match the currently-deployed v5 plugin.
    - xrootd <6
  run:
    - xrootd <6
    - xrdcl-pelican-fdp
    - certifi
  run_exports:
    weak:
      - libfdpio2 >=2.0.0,<3.0.0a0

tests:
  - script:
      env:
        BEARER_TOKEN: ${{ env.get("BEARER_TOKEN", default="") }}
        XRD_PLUGINCONFDIR: $PREFIX/etc/xrootd/client.plugins.d
        XRDCP_ALLOW_HTTP: "true"
        XRD_CURLNUMTHREADS: "1"
        XRD_CURLDISABLEPREFETCH: "1"
        XRD_PELICANUSEAUTHHEADERS: "true"
        XRD_LOGLEVEL: Debug
      content:
        - test -d $PREFIX/etc/xrootd/client.plugins.d
        - test -f $PREFIX/lib/libXrdClPelican-5.so
        - test -f $PREFIX/include/fdpio2/fdpio.h
        - test -f $PREFIX/lib/libfdpio2.so
        - test -f $PREFIX/lib/pkgconfig/fdpio2.pc
        - test_fdpio

about:
  homepage: https://github.com/GA-FDP/libfdpio
  license: Apache-2.0
  license_file: LICENSE
  summary: Fusion Data Platform I/O library for XRootD access
  description: |
    libfdpio provides a C/C++ interface for accessing files through XRootD
    protocols, specifically designed for the Fusion Data Platform. It supports
    various XRootD-compatible protocols including Pelican, HTTP, and HTTPS.
  repository: https://github.com/GA-FDP/libfdpio

extra:
  recipe-maintainers:
    - sammuli
