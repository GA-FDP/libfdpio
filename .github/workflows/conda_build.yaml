name: Conda Package CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'release-*'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest

      - name: Build Conda package
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
        run: |
          pixi global install rattler-build
          mkdir -p ${HOME}/outdir
          rattler-build build --recipe recipe/ \
            --channel ga-fdp \
            --channel conda-forge \
            --output-dir ${HOME}/outdir

      - name: Upload to Anaconda
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          pixi global install anaconda-client
          anaconda -t ${{ secrets.ANACONDA_API_TOKEN }} upload --force ${HOME}/outdir/linux-64/*.conda
