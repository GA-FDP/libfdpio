name: Conda Package CI/CD

on:
  push:
    branches:
      - main
    tags:
      - 'release-*'
  pull_request:
    branches:
      - main

jobs:
  build_and_test:
    # osx-arm64 builds natively on macOS: a cross-build from Linux would need
    # Apple's SDK, whose license limits it to Apple hardware.
    strategy:
      fail-fast: false
      matrix:
        include:
          - subdir: linux-64
            os: ubuntu-latest
            extra_channel: ""
          - subdir: osx-arm64
            os: macos-14
            # No osx-arm64 xrdcl-pelican-fdp is blessed yet; 0.3.1 is staged.
            # Linux keeps testing against what users install.
            extra_channel: ga-fdp/label/staging
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          # The build uses only a global rattler-build; the dev environment
          # in pixi.toml is linux-64 only and would fail to install on macOS.
          run-install: false

      - name: Build Conda package
        env:
          BEARER_TOKEN: ${{ secrets.BEARER_TOKEN }}
          EXTRA_CHANNEL: ${{ matrix.extra_channel }}
        run: |
          pixi global install rattler-build
          ./build_package.sh ${HOME}/outdir

      - name: Upload to Anaconda
        if: startsWith(github.ref, 'refs/tags/release-')
        run: |
          rattler-build upload anaconda \
            --owner ga-fdp \
            --api-key ${{ secrets.ANACONDA_API_TOKEN }} \
            --force \
            ${HOME}/outdir/${{ matrix.subdir }}/*.conda
