[project]
name = "libfdpio"
channels = ["ga-fdp", "conda-forge"]
platforms = ["linux-64"]

[dependencies]
cmake = "*"
make = "*"
pkg-config = "*"
cxx-compiler = "*"
xrootd = "*"
xrdcl-pelican-fdp = "*"
certifi = "*"

[tasks]
configure = "cmake -S . -B build -DCMAKE_PREFIX_PATH=$CONDA_PREFIX"
build = { cmd = "cmake --build build", depends-on = ["configure"] }
test = { cmd = "cd build && ctest --output-on-failure", depends-on = ["build"] }
clean = "rm -rf build"
